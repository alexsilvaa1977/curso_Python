site_name: Curso de Python
site_description: Curso completo de Python em português — do zero a desenvolvedor backend/geral.
site_url: https://alexsilvaa1977.github.io/curso_Python/
repo_url: https://github.com/alexsilvaa1977/curso_Python
repo_name: alexsilvaa1977/curso_Python
edit_uri: edit/main/

docs_dir: _docs
site_dir: site

exclude_docs: |
  __pycache__/
  .pytest_cache/
  .mypy_cache/
  .ipynb_checkpoints/
  *.pyc
  *.db
  *.sqlite3
  financas.json

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      include: ["*.ipynb"]

